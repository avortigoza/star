<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="shortcut icon" href="/favicon.ico?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <title>STAR - Storage Tracking &amp; Audit Reporting</title>
    <script>
      (function() {
        const savedTheme = localStorage.getItem('sar-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        // 'system' (or no saved preference at all, which defaults to
        // 'system' - see getInitialTheme() in App.tsx) follows the OS.
        const isDark = savedTheme === 'dark' || (savedTheme !== 'light' && prefersDark);
        if (isDark) {
          document.documentElement.classList.add('dark');
          if (document.body) document.body.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
